<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>NDULE+ — Musique de Goma</title>

<style>
:root{
  --bg:#08090f;
  --card:#11131c;
  --card2:#191c27;
  --text:#fff;
  --muted:#9298a8;
  --accent:#8b5cf6;
  --accent2:#6d28d9;
  --line:rgba(255,255,255,.08);
  --nav:72px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 10% 0%,rgba(124,58,237,.22),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(8,9,15,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:900;
}

.logo img{
  width:40px;
  height:40px;
  border-radius:11px;
  object-fit:cover;
}

.logo b{
  color:#a78bfa;
}

.header-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  display:grid;
  place-items:center;
}

main{
  width:min(1200px,92%);
  margin:auto;
  padding-bottom:130px;
}

.hero{
  min-height:390px;
  display:flex;
  align-items:center;
  padding:55px 0 35px;
}

.hero-content{
  max-width:720px;
}

.tag{
  color:#b9a3ff;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero h1{
  margin-top:18px;
  font-size:clamp(50px,9vw,90px);
  line-height:.92;
  letter-spacing:-5px;
}

.hero h1 span{
  color:#a78bfa;
}

.hero p{
  max-width:600px;
  margin-top:22px;
  color:var(--muted);
  line-height:1.7;
}

.explore{
  margin-top:27px;
  padding:14px 20px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.search{
  margin:10px 0 35px;
  position:relative;
}

.search input{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:15px;
  outline:none;
  background:var(--card);
  color:white;
  padding:0 18px 0 48px;
}

.search-icon{
  position:absolute;
  left:17px;
  top:17px;
  color:var(--muted);
}

.section{
  padding:28px 0;
}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:18px;
}

.section-title h2{
  font-size:26px;
}

.section-title p{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.video-card{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  transition:.25s;
}

.video-card:hover{
  transform:translateY(-5px);
  border-color:rgba(139,92,246,.45);
}

.thumbnail{
  position:relative;
  aspect-ratio:16/10;
  background:#050507;
  overflow:hidden;
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.play{
  position:absolute;
  right:11px;
  bottom:11px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:white;
  color:#08090f;
  display:grid;
  place-items:center;
  box-shadow:0 8px 25px #0008;
}

.video-info{
  padding:13px;
}

.video-info h3{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.video-info p{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.bottom-nav{
  position:fixed;
  z-index:500;
  bottom:0;
  left:0;
  right:0;
  height:var(--nav);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(8,9,15,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
}

.nav{
  height:100%;
  max-width:600px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav button{
  border:0;
  background:none;
  color:#777d8d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav button.active{
  color:#a78bfa;
}

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.93);
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal.show{
  display:flex;
}

.player{
  width:min(1050px,100%);
  background:#10121a;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.player-top{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:var(--card2);
  color:white;
}

.youtube{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.youtube iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.player-bottom{
  padding:15px;
}

.player-bottom h2{
  font-size:16px;
}

.player-bottom p{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.youtube-link{
  margin-top:12px;
  display:inline-flex;
  padding:10px 14px;
  border-radius:10px;
  background:#272a36;
  color:white;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

.empty{
  grid-column:1/-1;
  padding:45px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:900px){
  .video-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .hero{
    min-height:330px;
    padding-top:40px;
  }

  .hero h1{
    letter-spacing:-3px;
  }

  .video-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .video-info{
    padding:10px;
  }

  .video-info h3{
    font-size:11px;
  }

  .video-info p{
    font-size:9px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    <img
      src="https://i.postimg.cc/1V66N19t/Chat-GPT-Image-4-aout-2026-09-22-33.png"
      alt="Dalzon Shule">
    <span>NDULE<b>+</b></span>
  </div>

  <button class="header-btn" onclick="focusSearch()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </svg>
  </button>

</header>

<main>

<section class="hero" id="home">
  <div class="hero-content">
    <div class="tag">Musique de Goma</div>

    <h1>
      NDULE<br>
      <span>+</span>
    </h1>

    <p>
      Découvre les vidéos musicales des artistes de Goma
      dans une expérience moderne pensée pour le mobile.
    </p>

    <button class="explore"
            onclick="document.getElementById('music').scrollIntoView({behavior:'smooth'})">
      Explorer les vidéos
    </button>
  </div>
</section>

<div class="search">

  <svg class="search-icon"
       width="19"
       height="19"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2">
    <circle cx="11" cy="11" r="7"></circle>
    <path d="m20 20-4-4"></path>
  </svg>

  <input
    id="search"
    type="search"
    placeholder="Rechercher une vidéo..."
    oninput="filterVideos()">

</div>

<section class="section" id="music">

  <div class="section-title">
    <div>
      <h2>Vidéos</h2>
      <p>Les vidéos YouTube ajoutées à NDULE+</p>
    </div>
  </div>

  <div class="video-grid" id="videoGrid"></div>

</section>

</main>

<nav class="bottom-nav">

  <div class="nav">

    <button class="active"
            onclick="goTo('home',this)">
      <svg width="21" height="21" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 10 9-7 9 7"></path>
        <path d="M5 9v11h14V9"></path>
      </svg>
      <span>Accueil</span>
    </button>

    <button onclick="goTo('music',this)">
      <svg width="21" height="21" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <span>Musiques</span>
    </button>

    <button onclick="focusSearch()">
      <svg width="21" height="21" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
      <span>Recherche</span>
    </button>

    <button onclick="alert('Bibliothèque NDULE+ — bientôt disponible')">
      <svg width="21" height="21" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>Bibliothèque</span>
    </button>

  </div>

</nav>


<!-- LECTEUR YOUTUBE -->

<div class="modal" id="modal">

  <div class="player">

    <div class="player-top">

      <strong id="playerTitle">
        NDULE+
      </strong>

      <button class="close" onclick="closePlayer()">

        <svg width="20" height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>

      </button>

    </div>

    <div class="youtube">

      <iframe
        id="youtubeFrame"
        title="Lecteur NDULE+"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen>
      </iframe>

    </div>

    <div class="player-bottom">

      <h2 id="playerName">Vidéo YouTube</h2>

      <p>
        Lecture depuis le lecteur officiel YouTube.
      </p>

      <a
        id="youtubeDirect"
        class="youtube-link"
        target="_blank"
        rel="noopener noreferrer">
        Ouvrir directement sur YouTube
      </a>

    </div>

  </div>

</div>


<script>

/*
==========================================================
  VRAIS LIENS FOURNIS POUR NDULE+
==========================================================
*/

const videos = [

  "https://youtu.be/kRcr6waZvHA",
  "https://youtu.be/LEwfFxrvzp0",
  "https://youtu.be/nDLncG-iYD4",
  "https://youtu.be/ts87r5MVt2I",
  "https://youtu.be/O1_gxdgOjBc",
  "https://youtu.be/igg-KQbgRrA",
  "https://youtu.be/ivJz9VFTiBk",
  "https://youtu.be/rVVKV1p3l18",
  "https://youtu.be/PNQhwRTIzg0",
  "https://youtu.be/HSaphIKFeBg",
  "https://youtu.be/_1XrYV51FPw",
  "https://youtu.be/vIePNpRAiyM",
  "https://youtu.be/YKYoCHUG1lA",
  "https://youtu.be/q-aB_SShtmM",
  "https://youtu.be/aDEwo1TlDDQ",
  "https://youtu.be/pGLMS49cvTA",
  "https://youtu.be/n2dwe5P2YJM",
  "https://youtu.be/G1iVCRtcKqY",
  "https://youtu.be/BZ2WqvumYH4",
  "https://youtu.be/0ApOGQl8INA",
  "https://youtu.be/jFR_W2ODIOM",
  "https://youtu.be/jVicXq_WIGI",
  "https://youtu.be/Nr5NnSyE4J4",
  "https://youtu.be/FzkLWh7Q-yM",
  "https://youtu.be/hy5dxHIGtv4",
  "https://youtu.be/flngIZlumRw",
  "https://youtu.be/dhareDrAoMo",
  "https://youtu.be/R2a9kSeTnBs",
  "https://youtu.be/QozSu9M_rRI",
  "https://youtu.be/VGdhpZt4UKI",
  "https://youtu.be/wxUtO0Je8Rk",
  "https://youtu.be/vEIhgeVF-Bw",
  "https://youtu.be/sfohgE1HKhE"

];


/*
==========================================================
  EXTRACTION DE L'ID YOUTUBE
==========================================================
*/

function getVideoId(url){

  try{

    const parsed = new URL(url);

    if(parsed.hostname === "youtu.be"){
      return parsed.pathname.substring(1);
    }

    if(parsed.hostname.includes("youtube.com")){
      return parsed.searchParams.get("v");
    }

  }catch(error){

    return null;

  }

  return null;
}


/*
==========================================================
  MINIATURE
==========================================================
*/

function getThumbnail(url){

  const id = getVideoId(url);

  if(!id){
    return "";
  }

  return "https://i.ytimg.com/vi/" +
         id +
         "/hqdefault.jpg";
}


/*
==========================================================
  AFFICHAGE
==========================================================
*/

function renderVideos(list = videos){

  const grid =
    document.getElementById("videoGrid");

  grid.innerHTML = "";

  if(!list.length){

    grid.innerHTML =
      '<div class="empty">Aucune vidéo trouvée.</div>';

    return;
  }

  list.forEach((url,index)=>{

    const id = getVideoId(url);

    if(!id) return;

    const card =
      document.createElement("article");

    card.className = "video-card";

    card.innerHTML = `

      <div class="thumbnail">

        <img
          src="${getThumbnail(url)}"
          alt="Vidéo YouTube"
          loading="lazy">

        <button class="play"
                aria-label="Lire la vidéo">

          <svg width="20" height="20"
               viewBox="0 0 24 24"
               fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>

        </button>

      </div>

      <div class="video-info">

        <h3>Vidéo YouTube</h3>

        <p>NDULE+ • YouTube</p>

      </div>
    `;

    card.addEventListener(
      "click",
      ()=>openPlayer(index)
    );

    grid.appendChild(card);

  });

}


/*
==========================================================
  OUVERTURE DU LECTEUR
==========================================================
*/

function openPlayer(index){

  const originalUrl = videos[index];

  const id = getVideoId(originalUrl);

  if(!id){
    return;
  }

  const embed =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(id) +
    "?autoplay=1&playsinline=1&rel=0";

  document.getElementById("youtubeFrame").src =
    embed;

  document.getElementById("youtubeDirect").href =
    "https://www.youtube.com/watch?v=" + id;

  document.getElementById("playerTitle").textContent =
    "NDULE+";

  document.getElementById("playerName").textContent =
    "Vidéo YouTube";

  document.getElementById("modal")
    .classList.add("show");

  document.body.style.overflow="hidden";
}


/*
==========================================================
  FERMETURE
==========================================================
*/

function closePlayer(){

  document.getElementById("youtubeFrame").src="";

  document.getElementById("modal")
    .classList.remove("show");

  document.body.style.overflow="";
}


/*
==========================================================
  RECHERCHE
==========================================================
*/

function filterVideos(){

  const query =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  /*
    Pour l'instant les vidéos n'ont pas de faux titres.
    La recherche peut donc rechercher l'ID ou l'URL.
  */

  const results =
    videos.filter(url =>
      url.toLowerCase().includes(query)
    );

  renderVideos(results);
}


/*
==========================================================
  RECHERCHE
==========================================================
*/

function focusSearch(){

  const search =
    document.getElementById("search");

  search.focus();

  search.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}


/*
==========================================================
  NAVIGATION
==========================================================
*/

function goTo(id,button){

  document.querySelectorAll(".nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  document.getElementById(id)
    .scrollIntoView({
      behavior:"smooth"
    });
}


/*
==========================================================
  FERMER EN CLIQUANT À CÔTÉ
==========================================================
*/

document.getElementById("modal")
.addEventListener("click",function(event){

  if(event.target === this){
    closePlayer();
  }

});


/*
==========================================================
  ESC
==========================================================
*/

document.addEventListener("keydown",function(event){

  if(event.key === "Escape"){
    closePlayer();
  }

});


/*
==========================================================
  INITIALISATION
==========================================================
*/

renderVideos();

</script>

</body>
</html>
