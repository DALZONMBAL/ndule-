<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d12" />
<title>NDULE+ — La musique de Goma</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NDULE+" />
<style>
  :root{
    --bg:#0d0d12; --surface:#16161f; --surface-light:#1e1e2a;
    --primary:#a855f7; --primary-dark:#7e22ce; --primary-light:#d8b4fe;
    --text:#ffffff; --text-dim:rgba(255,255,255,0.5); --text-faint:rgba(255,255,255,0.3);
    --border:rgba(255,255,255,0.07);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
    padding-bottom:70px;
    position:relative;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; position:relative; overflow:hidden;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--primary-dark); border-radius:999px;}
  ::selection{background:var(--primary); color:#fff;}

  /* Fond ambiant animé (immersion) */
  .ambient-glow{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
  .ambient-glow span{
    position:absolute; border-radius:50%; filter:blur(80px); opacity:.18;
    animation:drift 22s ease-in-out infinite alternate;
  }
  .ambient-glow span:nth-child(1){width:340px;height:340px; background:var(--primary); top:-80px; left:-60px; animation-duration:26s;}
  .ambient-glow span:nth-child(2){width:280px;height:280px; background:#7e22ce; bottom:-60px; right:-40px; animation-duration:20s; animation-delay:-6s;}
  .ambient-glow span:nth-child(3){width:220px;height:220px; background:#d8b4fe; top:40%; left:60%; animation-duration:30s; animation-delay:-12s;}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(40px,30px) scale(1.15);}
  }
  @media(prefers-reduced-motion:reduce){
    .ambient-glow span{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* Ripple (bouton pro) */
  .ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,0.35); transform:scale(0); animation:ripple-anim .55s ease-out forwards; pointer-events:none;}
  @keyframes ripple-anim{ to{ transform:scale(2.6); opacity:0; } }

  /* Transition de page */
  #main.page-transition{animation:pageIn .38s var(--ease);}
  @keyframes pageIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* Révélation au scroll */
  .reveal{opacity:0; transform:translateY(16px); transition:opacity .5s var(--ease), transform .5s var(--ease);}
  .reveal.in-view{opacity:1; transform:translateY(0);}

  .glass{
    background:rgba(30,30,42,0.65);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    transition:background .25s, box-shadow .25s;
  }

  /* HEADER */
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    transition:background .25s, box-shadow .25s, backdrop-filter .25s;
  }
  header.scrolled{box-shadow:0 8px 24px rgba(0,0,0,0.35);}
  .logo{font-size:22px; font-weight:800; color:var(--primary); letter-spacing:-0.5px;}
  .logo span{font-size:10px; display:block; color:var(--text-faint); font-weight:400; letter-spacing:0;}
  .header-icons{display:flex; align-items:center; gap:14px;}
  .icon-btn{width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,0.06);}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; overflow:hidden;}

  /* BOTTOM NAV */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:space-around; align-items:center;
    padding:8px 4px 10px; border-top:1px solid var(--border);
  }
  nav.bottom button{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; color:var(--text-dim); padding:4px 10px; border-radius:10px;
    transition:color .25s, transform .2s;
  }
  nav.bottom button svg{transition:transform .3s cubic-bezier(.34,1.6,.64,1);}
  nav.bottom button.active{color:var(--primary);}
  nav.bottom button.active svg{transform:translateY(-2px) scale(1.08);}
  nav.bottom button:active{transform:scale(.92);}
  nav.bottom svg{width:22px; height:22px;}

  main{min-height:calc(100vh - 130px); padding:16px; padding-bottom:16px; transition:padding-bottom .15s;}
  body.has-mini-player main{padding-bottom:80px;}
  .hidden{display:none !important;}

  h1.page-title{font-size:24px; font-weight:800; margin-bottom:16px;}
  h2.section-title{font-size:17px; font-weight:700; margin-bottom:12px;}
  section{margin-bottom:28px;}

  /* Horizontal scroller (artists) */
  .h-scroll{display:flex; gap:18px; overflow-x:auto; padding-bottom:4px;}
  .artist-item{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:84px; text-align:center; transition:transform .25s var(--ease); position:relative; overflow:hidden; border-radius:12px; padding:4px 0;}
  .artist-item:hover{transform:translateY(-4px);}
  .artist-photo{width:78px; height:78px; border-radius:50%; background:var(--surface-light); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:var(--primary); overflow:hidden; border:2px solid transparent; transition:box-shadow .25s, border-color .25s;}
  .artist-item:hover .artist-photo{box-shadow:0 8px 22px rgba(168,85,247,0.35);}
  .artist-photo.following{border-color:var(--primary);}
  .artist-name{font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;}
  .artist-sub{font-size:10.5px; color:var(--text-faint);}

  /* Grid cards */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{background:var(--surface); border-radius:16px; padding:10px; position:relative; overflow:hidden; cursor:pointer; transition:transform .3s var(--ease), background .2s, box-shadow .3s var(--ease);}
  .card:hover{background:var(--surface-light); transform:translateY(-5px); box-shadow:0 14px 30px rgba(0,0,0,0.4);}
  .card:active{transform:translateY(-2px) scale(.98);}
  .card .cover{aspect-ratio:1/1; border-radius:12px; background:linear-gradient(135deg,var(--primary-dark),#2a2a3a); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; margin-bottom:8px;}
  .card .cover img{transition:transform .4s var(--ease);}
  .card:hover .cover img{transform:scale(1.08);}
  .card.video .cover{aspect-ratio:16/9;}
  .cover .play-overlay{position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s;}
  .cover .play-overlay svg{width:34px; height:34px; transform:scale(.7); transition:transform .25s var(--ease);}
  .card:hover .play-overlay{opacity:1;}
  .card:hover .play-overlay svg{transform:scale(1);}
  .card-title{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-sub{font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fav-btn{position:absolute; top:16px; right:16px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; transition:background .2s;}
  .fav-btn svg{width:13px; height:13px; transition:transform .3s cubic-bezier(.34,1.8,.64,1);}
  .fav-btn.active svg{fill:var(--primary); stroke:var(--primary);}
  .fav-btn.pop svg{transform:scale(1.5);}
  .fav-btn:hover{background:rgba(0,0,0,0.75);}
  .verify-badge{position:absolute; top:8px; left:8px; background:#eab308; color:#000; font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px;}

  /* Buttons / inputs */
  .btn{padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; text-align:center; transition:transform .15s var(--ease), filter .2s, box-shadow .2s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 14px rgba(168,85,247,0.35);}
  .btn-primary:hover{background:var(--primary-dark); box-shadow:0 6px 20px rgba(168,85,247,0.5);}
  .btn-ghost{background:rgba(255,255,255,0.08); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.14);}
  .btn-white{background:#fff; color:#000;}
  .btn-white:hover{filter:brightness(.94);}
  .field{width:100%; padding:13px 16px; border-radius:12px; background:var(--surface-light); border:1px solid transparent; color:#fff; font-size:14px; outline:none; transition:border-color .2s, box-shadow .2s;}
  .field:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(168,85,247,0.2);}
  .field::placeholder{color:var(--text-faint);}

  /* Search bar */
  .searchbar{display:flex; align-items:center; gap:10px; background:var(--surface-light); border-radius:14px; padding:12px 16px; margin-bottom:20px;}
  .searchbar input{flex:1; background:none; border:none; outline:none; color:#fff; font-size:14px;}
  .searchbar svg{width:18px; height:18px; color:var(--text-faint); flex-shrink:0;}

  /* Auth screens */
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{width:100%; max-width:380px; border-radius:22px; padding:32px 28px;}
  .divider{display:flex; align-items:center; gap:10px; margin:18px 0; font-size:12px; color:var(--text-faint);}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .error-box{background:rgba(239,68,68,0.12); color:#f87171; font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:14px;}
  .success-box{background:rgba(34,197,94,0.12); color:#4ade80; font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:14px;}
  .stack{display:flex; flex-direction:column; gap:11px;}
  .row2{display:flex; gap:10px;}
  .switch-link{text-align:center; font-size:13.5px; color:var(--text-dim); margin-top:20px;}
  .switch-link a{color:var(--primary); font-weight:600;}

  /* Profile */
  .profile-header{text-align:center; padding:28px 16px; border-radius:20px;}
  .profile-avatar-wrap{position:relative; width:90px; height:90px; margin:0 auto 14px;}
  .profile-avatar{width:90px; height:90px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; overflow:hidden;}
  .profile-avatar img{width:100%; height:100%; object-fit:cover;}
  .avatar-upload-btn{position:absolute; bottom:0; right:0; width:30px; height:30px; border-radius:50%; background:var(--surface-light); border:2px solid var(--bg); display:flex; align-items:center; justify-content:center;}
  .avatar-upload-btn svg{width:15px; height:15px;}
  .stats-row{display:flex; justify-content:center; gap:26px; margin-top:16px;}
  .stat{text-align:center;}
  .stat b{display:block; font-size:18px;}
  .stat span{font-size:11px; color:var(--text-faint);}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto;}
  .tab-btn{padding:9px 16px; border-radius:999px; background:var(--surface-light); font-size:13px; font-weight:600; color:var(--text-dim); white-space:nowrap; display:flex; align-items:center; gap:6px;}
  .tab-btn.active{background:var(--primary); color:#fff;}

  /* Player full screen */
  #player-full{position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .3s ease;}
  #player-full.open{transform:translateY(0);}
  .player-top{display:flex; align-items:center; justify-content:space-between; padding:16px;}
  .player-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px 40px; text-align:center;}
  .player-cover{width:260px; height:260px; max-width:70vw; max-height:70vw; border-radius:20px; background:linear-gradient(135deg,var(--primary-dark),#222); box-shadow:0 20px 60px rgba(168,85,247,0.25); margin-bottom:28px; display:flex; align-items:center; justify-content:center; font-size:60px;}
  .video-frame-wrap{width:100%; max-width:640px; aspect-ratio:16/9; border-radius:18px; overflow:hidden; margin-bottom:24px;}
  .video-frame-wrap iframe{width:100%; height:100%; border:0;}
  .player-title{font-size:19px; font-weight:700; margin-bottom:4px;}
  .player-artist{font-size:14px; color:var(--text-dim); margin-bottom:26px;}
  .player-controls{display:flex; align-items:center; gap:30px;}
  .play-btn{width:56px; height:56px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center;}
  .player-controls svg{width:24px; height:24px;}
  .play-btn svg{width:26px; height:26px;}

  /* mini player */
  #mini-player{
    position:fixed; left:8px; right:8px; bottom:66px; z-index:50;
    display:flex; align-items:center; gap:10px; border-radius:16px; padding:8px 10px;
  }
  #mini-player.hidden{display:none;}
  .mini-video-wrap{display:none;width:112px;height:63px;flex:0 0 112px;border-radius:9px;overflow:hidden;background:#000}
  .mini-video-wrap iframe{width:100%;height:100%;border:0}
  #mini-player.has-mini-video .mini-video-wrap{display:block}
  #mini-player.has-mini-video .mini-cover{display:none}
  .mini-cover{width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--primary-dark),#222); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .mini-info{flex:1; min-width:0;}
  .mini-info p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-title{font-size:13px; font-weight:600;}
  .mini-artist{font-size:11px; color:var(--text-faint);}
  .mini-play{width:34px; height:34px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mini-play svg{width:15px; height:15px;}

  .empty-state{color:var(--text-faint); font-size:13.5px; padding:20px 0; text-align:center;}
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--surface-light); border:1px solid var(--border); padding:10px 18px; border-radius:12px; font-size:13px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}

  @media(min-width:860px){
    body{padding-bottom:0; padding-left:230px;}
    nav.bottom{display:none;}
    .sidebar{position:fixed; top:0; left:0; bottom:0; width:230px; padding:24px 14px; display:flex; flex-direction:column; border-right:1px solid var(--border);}
    .sidebar .logo{margin-bottom:30px; padding-left:8px;}
    .sidebar button{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-size:14px; font-weight:600; color:var(--text-dim); width:100%; text-align:left;}
    .sidebar button.active{background:rgba(168,85,247,0.18); color:var(--primary);}
    .sidebar svg{width:20px; height:20px;}
    header{display:none;}
    #mini-player{left:246px; right:16px; bottom:16px;}
  }
  @media(max-width:859px){.sidebar{display:none;}}
</style>
  <style>
    .install-app-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
    .install-app-btn svg{width:16px;height:16px}
    @media(max-width:420px){.install-app-btn span{display:none}.install-app-btn{width:36px;height:36px;justify-content:center;padding:0}}
  </style>
</head>
<body>
<div class="ambient-glow"><span></span><span></span><span></span></div>

<!-- ================= SIDEBAR (desktop) ================= -->
<aside class="sidebar glass">
  <div class="logo">NDULE+<span>La musique de Goma</span></div>
  <div id="sidebar-nav" style="display:flex;flex-direction:column;gap:2px;flex:1;"></div>
  <button data-nav="profile" style="margin-top:10px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
    <span id="sidebar-username">Profil</span>
  </button>
  <button class="install-app-btn" id="install-app-btn-side" type="button" style="margin-top:12px;justify-content:center;">
    <span>Installer NDULE+</span>
  </button>
</aside>

<!-- ================= HEADER (mobile) ================= -->
<header class="glass">
  <div class="logo">NDULE+</div>
  <div class="header-icons">
    <button class="icon-btn" data-nav="search" aria-label="Rechercher">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="avatar" data-nav="profile" id="header-avatar">?</button>
    <button class="install-app-btn" id="install-app-btn" type="button" aria-label="Installer NDULE+">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v3h14v-3"/></svg><span>Installer</span>
    </button>
  </div>
</header>

<main id="main"></main>

<!-- ================= MINI PLAYER ================= -->
<div id="mini-player" class="glass hidden">
  <div class="mini-video-wrap" id="mini-video-wrap" aria-label="Lecteur vidéo réduit"></div>
  <div class="mini-cover" id="mini-cover">🎵</div>
  <div class="mini-info">
    <p class="mini-title" id="mini-title">—</p>
    <p class="mini-artist" id="mini-artist">—</p>
  </div>
  <button class="mini-play" id="mini-play-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path id="mini-play-icon" d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- ================= FULL PLAYER ================= -->
<div id="player-full">
  <div class="player-top">
    <button id="player-minimize" aria-label="Réduire">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <span style="font-size:11px;letter-spacing:1px;color:var(--text-faint);text-transform:uppercase;">Lecture en cours</span>
    <button id="player-close" aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="player-body">
    <div id="player-video-wrap" class="video-frame-wrap hidden"></div>
    <div id="player-cover" class="player-cover">🎵</div>
    <h2 class="player-title" id="player-title">—</h2>
    <p class="player-artist" id="player-artist">—</p>
    <div class="player-controls" id="audio-controls">
      <button aria-label="Précédent"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play-btn" id="player-play-btn"><svg viewBox="0 0 24 24" fill="#fff"><path id="player-play-icon" d="M8 5v14l11-7z"/></svg></button>
      <button aria-label="Suivant"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
    </div>
  </div>
</div>

<!-- ================= BOTTOM NAV (mobile) ================= -->
<nav class="bottom glass" id="bottom-nav"></nav>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   NDULE+ — Démo autonome (single-file)
   Auth + favoris + playlists simulés en localStorage (démo uniquement,
   pas de vrai backend). Pour la vraie plateforme avec PostgreSQL,
   Prisma, JWT, Google OAuth réel etc., utilise le projet full-stack
   fourni précédemment (frontend/ + backend/).
================================================================ */

// ---------- Icônes SVG (Lucide-like, inline, pas d'emoji comme icônes UI) ----------
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg>',

// ---------- Navigation ----------
const NAV_ITEMS = [
  {key:'home', label:'Accueil', icon:'home'},
  {key:'explore', label:'Explorer', icon:'compass'},
  {key:'music', label:'Musique', icon:'music'},
  {key:'search', label:'Recherche', icon:'search'},
  {key:'library', label:'Bibliothèque', icon:'library'},
];

function buildNav(){
  const bottom = document.getElementById('bottom-nav');
  const side = document.getElementById('sidebar-nav');
  bottom.innerHTML = '';
  side.innerHTML = '';
  NAV_ITEMS.forEach(item=>{
    const b1 = document.createElement('button');
    b1.dataset.nav = item.key;
    b1.innerHTML = ICONS[item.icon] + `<span>${item.label}</span>`;
    b1.onclick = ()=>navigate(item.key);
    bottom.appendChild(b1);

    const b2 = document.createElement('button');
    b2.dataset.nav = item.key;
    b2.innerHTML = ICONS[item.icon] + `<span>${item.label}</span>`;
    b2.onclick = ()=>navigate(item.key);
    side.appendChild(b2);
  });
}

document.querySelectorAll('[data-nav]').forEach(el=>{
  if(!el.closest('#bottom-nav') && !el.closest('#sidebar-nav')){
    el.addEventListener('click', ()=> navigate(el.dataset.nav));
  }
});

function navigate(route){
  currentRoute = route;
  render();
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav === route);
  });
  window.scrollTo(0,0);
}

// ---------- Toast ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Rendu principal ----------
function render(){
  const main = document.getElementById('main');
  const user = store.user;

  if(!user && (currentRoute === 'library' || currentRoute === 'profile')){
    main.innerHTML = renderAuthGate();
    return;
  }

  switch(currentRoute){
    case 'home': main.innerHTML = renderHome(); break;
    case 'explore': main.innerHTML = renderExplore(); break;
    case 'music': main.innerHTML = renderMusic(); break;
    case 'search': main.innerHTML = renderSearch(); break;
    case 'library': main.innerHTML = renderLibrary(); break;
    case 'profile': main.innerHTML = renderProfile(); break;
    case 'login': main.innerHTML = renderLogin(); break;
    case 'register': main.innerHTML = renderRegister(); break;
    case 'artist':
      main.innerHTML = renderArtistDetail(window.__artistId);
      break;
    default: main.innerHTML = renderHome();
  }

  attachDynamicHandlers();
  updateHeaderAvatar();
  main.classList.remove('page-transition');
  void main.offsetWidth; // force reflow pour rejouer l'animation
  main.classList.add('page-transition');
  observeReveals();
}

function updateHeaderAvatar(){
  const user = store.user;
  const headerAvatar = document.getElementById('header-avatar');
  const sidebarName = document.getElementById('sidebar-username');
  if(user){
    headerAvatar.innerHTML = user.avatarPhoto
      ? `<img src="${user.avatarPhoto}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
      : user.firstName[0].toUpperCase();
    sidebarName.textContent = user.firstName;
  } else {
    headerAvatar.textContent = '?';
    sidebarName.textContent = 'Profil';
  }
}

function artistItem(a){
  const following = (store.user?.follows||[]).includes(a.id);
  const count = DEMO_TRACKS.filter(t=>t.artistId===a.id).length;
  return `
  <div class="artist-item" data-open-artist="${a.id}">
    <div class="artist-photo ${following?'following':''}">${a.initials}</div>
    <div class="artist-name">${a.name}</div>
    <div class="artist-sub">${count} morceau${count>1?'x':''}</div>
  </div>`;
}

function trackCard(t){
  const fav = store.favorites.includes('t_'+t.id);
  return `
  <div class="card" data-play-track="${t.id}">
    <div class="cover">

}

function renderSearch(){

      <input id="search-input" placeholder="Rechercher un artiste, une musique, une vidéo..." oninput="doSearch(this.value)" />
    </div>
    <div id="search-results"></div>
  `;
}

window.doSearch = function(q){
  const box = document.getElementById('search-results');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return; }
  const artists = DEMO_ARTISTS.filter(a=>a.name.toLowerCase().includes(q));
  const tracks = DEMO_TRACKS.filter(t=>t.title.toLowerCase().includes(q));
  const videos = DEMO_VIDEOS.filter(v=>v.title.toLowerCase().includes(q));
  if(!artists.length && !tracks.length && !videos.length){
    box.innerHTML = `<p class="empty-state">Aucun résultat pour "${q}".</p>`;
    return;
  }
  box.innerHTML = `
    ${artists.length?`<section><h2 class="section-title">Artistes</h2><div class="h-scroll">${artists.map(artistItem).join('')}</div></section>`:''}
    ${tracks.length?`<section><h2 class="section-title">Musiques</h2><div class="grid">${tracks.map(trackCard).join('')}</div></section>`:''}
    ${videos.length?`<section><h2 class="section-title">Vidéos</h2><div class="grid">${videos.map(videoCard).join('')}</div></section>`:''}
  `;
  attachDynamicHandlers();
  observeReveals();
};

          `<div class="grid">${playlists.map(p=>`
            <div class="card">
              <div class="cover">🎼</div>

              <div class="card-sub">${p.tracks.length} titres</div>
            </div>`).join('')}</div>`

      ` : libraryTab==='favorites' ? `

        <button class="btn btn-white" style="width:100%;" onclick="toast('Nécessite la configuration Google OAuth réelle (voir README du projet complet).')">Continuer avec Google</button>
        <p class="switch-link">Déjà un compte ? <a onclick="navigate('login')">Se connecter</a></p>
      </div>
    </div>
  `;
}

function renderArtistDetail(id){
  const a = DEMO_ARTISTS.find(x=>x.id===id);
  if(!a) return `<p class="empty-state">Artiste introuvable.</p>`;
  const tracks = DEMO_TRACKS.filter(t=>t.artistId===id);
  const videos = DEMO_VIDEOS.filter(v=>v.artistId===id);
  const following = (store.user?.follows||[]).includes(id);
  return `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <div class="artist-photo" style="width:70px;height:70px;">${a.initials}</div>
      <div style="flex:1;">
        <h1 style="font-size:19px;font-weight:700;">${a.name}</h1>
        <p style="font-size:12.5px;color:var(--text-faint);">${a.city}</p>
      </div>
      <button class="btn ${following?'btn-ghost':'btn-primary'}" id="follow-btn" data-artist="${id}">${following?'Suivi':'Suivre'}</button>
    </div>
    ${a.bio?`<p style="font-size:13.5px;color:var(--text-dim);margin-bottom:22px;line-height:1.5;">${a.bio}</p>`:''}
    <section><h2 class="section-title">Musiques</h2>
      ${tracks.length?`<div class="grid">${tracks.map(trackCard).join('')}</div>`:`<p class="empty-state">Aucune musique.</p>`}
    </section>
    <section><h2 class="section-title">Vidéos</h2>
      ${videos.length?`<div class="grid">${videos.map(videoCard).join('')}</div>`:`<p class="empty-state">Aucune vidéo.</p>`}
    </section>
  `;
}

// ---------- Handlers dynamiques (délégation après chaque render) ----------
function attachDynamicHandlers(){
  document.querySelectorAll('[data-open-artist]').forEach(el=>{
    el.onclick = ()=>{ window.__artistId = el.dataset.openArtist; navigate('artist'); };
  });
  document.querySelectorAll('[data-play-track]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-fav-track]')) return;
      const t = DEMO_TRACKS.find(x=>x.id===el.dataset.playTrack);
      playTrack(t);
    };
  });
  document.querySelectorAll('[data-play-video]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-fav-video]')) return;
      const v = DEMO_VIDEOS.find(x=>x.id===el.dataset.playVideo);
      playVideo(v);
    };
  });
  document.querySelectorAll('[data-fav-track]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      el.classList.add('pop');
      setTimeout(()=>toggleFavorite('t_'+el.dataset.favTrack), 220);
    };
  });
  document.querySelectorAll('[data-fav-video]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      el.classList.add('pop');
      setTimeout(()=>toggleFavorite('v_'+el.dataset.favVideo), 220);
    };
  });
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ libraryTab = el.dataset.tab; render(); };
  });

  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.onsubmit = handleLogin;
  const registerForm = document.getElementById('register-form');
  if(registerForm) registerForm.onsubmit = handleRegister;

  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    localStorage.removeItem('ndule_user');
    toast('Déconnexion réussie.');
    navigate('home');
  };
  const deleteBtn = document.getElementById('delete-account-btn');
  if(deleteBtn) deleteBtn.onclick = ()=>{
    if(confirm('Supprimer définitivement ton compte NDULE+ ?')){
      localStorage.removeItem('ndule_user');
      toast('Compte supprimé.');
      navigate('register');
    }
  };
  const avatarUploadBtn = document.getElementById('avatar-upload-btn');
  const avatarFileInput = document.getElementById('avatar-file-input');
  if(avatarUploadBtn && avatarFileInput){
    avatarUploadBtn.onclick = ()=> avatarFileInput.click();
    avatarFileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){
        toast('Merci de choisir un fichier image.');
        return;
      }
      if(file.size > 3 * 1024 * 1024){
        toast('Image trop lourde (max 3 Mo).');
        return;
      }
      const reader = new FileReader();
      reader.onload = ()=>{
        const user = store.user;
        user.avatarPhoto = reader.result; // stocké en base64 (démo locale)
        const accounts = store.accounts;
        if(accounts[user.email]) accounts[user.email] = user;
        store.accounts = accounts;
        store.user = user;
        toast('Photo de profil mise à jour !');
        render();
      };
      reader.readAsDataURL(file);
    };
  }
  const createPlaylistBtn = document.getElementById('create-playlist-btn');
  if(createPlaylistBtn) createPlaylistBtn.onclick = ()=>{
    const input = document.getElementById('new-playlist-name');
    if(!input.value.trim()) return;
    const playlists = store.playlists;
    playlists.push({id:'p'+Date.now(), name:input.value.trim(), tracks:[]});
    store.playlists = playlists;
    render();
  };
  const followBtn = document.getElementById('follow-btn');
  if(followBtn) followBtn.onclick = ()=>{
    const user = store.user;
    if(!user){ navigate('login'); return; }
    const id = followBtn.dataset.artist;
    user.follows = user.follows || [];
    const idx = user.follows.indexOf(id);
    if(idx>=0) user.follows.splice(idx,1); else user.follows.push(id);
    store.user = user;
    render();
  };
}

// ---------- Auth simulée (démo locale) ----------
function handleLogin(e){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const accounts = store.accounts;
  const acc = accounts[data.email];
  const errBox = document.getElementById('login-error');
  if(!acc || acc.password !== data.password){
    errBox.innerHTML = `<div class="error-box">Adresse e-mail ou mot de passe incorrect.</div>`;
    return;
  }
  store.user = acc;
  toast('Connexion réussie !');
  navigate('home');
}

function handleRegister(e){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const errBox = document.getElementById('register-error');
  if(data.password !== data.confirmPassword){
    errBox.innerHTML = `<div class="error-box">Les mots de passe ne correspondent pas.</div>`;
    return;
  }
  const accounts = store.accounts;
  if(accounts[data.email]){
    errBox.innerHTML = `<div class="error-box">Un compte existe déjà avec cette adresse e-mail.</div>`;
    return;
  }
  const newUser = {
    firstName:data.firstName, lastName:data.lastName, email:data.email,
    password:data.password, createdAt:new Date().toLocaleDateString('fr-FR'), follows:[]
  };
  accounts[data.email] = newUser;
  store.accounts = accounts;
  store.user = newUser;
  toast('Compte créé avec succès !');
  navigate('home');
}

// ---------- Favoris ----------
function toggleFavorite(key){
  if(!store.user){ navigate('login'); return; }
  let favs = store.favorites;
  if(favs.includes(key)) favs = favs.filter(f=>f!==key);
  else favs.push(key);
  store.favorites = favs;
  render();
}

// ---------- Lecteur ----------
function addHistory(item, type){
  const h = store.history;
  h.unshift({title:item.title, artist:item.artist, type, date:new Date().toLocaleDateString('fr-FR')});
  store.history = h.slice(0,50);
}

function playTrack(t){
  // Toutes les chansons de ce catalogue sont adossées à leur clip officiel réel
  // (pas de fichier audio séparé hébergé) : la lecture utilise donc le clip YouTube,
  // qui est la source réelle et vérifiée de la chanson.
  nowPlaying = {type: t.youtubeId ? 'video' : 'track', data:t};
  isPlaying = true;
  if(store.user) addHistory(t,'track');
  openFullPlayer();
  updatePlayerUI();
}

function playVideo(v){
  nowPlaying = {type:'video', data:v};
  isPlaying = true;
  if(store.user) addHistory(v,'video');
  openFullPlayer();
  updatePlayerUI();
}

function updatePlayerUI(){
  if(!nowPlaying) return;
  const {type, data} = nowPlaying;
  document.getElementById('player-title').textContent = data.title;
  document.getElementById('player-artist').textContent = data.artist;
  document.getElementById('mini-title').textContent = data.title;
  document.getElementById('mini-artist').textContent = data.artist;
  document.getElementById('mini-player').classList.remove('hidden');
  document.body.classList.add('has-mini-player');

  const videoWrap = document.getElementById('player-video-wrap');
  const cover = document.getElementById('player-cover');
  const audioControls = document.getElementById('audio-controls');

  if(type === 'video'){
    videoWrap.classList.remove('hidden');
    cover.classList.add('hidden');
    audioControls.classList.add('hidden');
    videoWrap.innerHTML = `<iframe title="NDULE+ — ${String(data.title).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" src="https://www.youtube.com/embed/${encodeURIComponent(data.youtubeId)}?autoplay=1&playsinline=1&controls=1&rel=0&enablejsapi=1" allow="autoplay; encrypted-media; picture-in-picture; accelerometer; gyroscope; web-share" allowfullscreen></iframe>`;
    document.getElementById('mini-player').classList.add('has-mini-video');
  } else {
    videoWrap.classList.add('hidden');
    videoWrap.innerHTML = '';
    document.getElementById('mini-player').classList.remove('has-mini-video');
    cover.classList.remove('hidden');
    audioControls.classList.remove('hidden');
  }
  setPlayIcon(true);
}

function setPlayIcon(playing){
  isPlaying = playing;
  const path = playing ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z';
  document.getElementById('player-play-icon').setAttribute('d', path);
  document.getElementById('mini-play-icon').setAttribute('d', path);
}

document.getElementById('player-minimize').onclick = ()=>{
  const frame = document.querySelector('#player-video-wrap iframe');
  if(frame) document.getElementById('mini-video-wrap').appendChild(frame);
  document.getElementById('player-full').classList.remove('open');
};
document.getElementById('player-close').onclick = ()=>{
  document.getElementById('player-full').classList.remove('open');
  document.getElementById('mini-player').classList.add('hidden');
  document.getElementById('mini-player').classList.remove('has-mini-video');
  document.getElementById('mini-video-wrap').innerHTML = '';
  document.getElementById('player-video-wrap').innerHTML = '';
  document.body.classList.remove('has-mini-player');
  nowPlaying = null;
};
function openFullPlayer(){
  const miniFrame = document.querySelector('#mini-video-wrap iframe');
  if(miniFrame) document.getElementById('player-video-wrap').appendChild(miniFrame);
  document.getElementById('player-full').classList.add('open');
}
document.getElementById('mini-player').addEventListener('click',(e)=>{
  if(e.target.closest('#mini-play-btn')) return;
  openFullPlayer();
});
document.getElementById('mini-play-btn').onclick = (e)=>{
  e.stopPropagation();
  if(nowPlaying?.type==='track') setPlayIcon(!isPlaying);
};
document.getElementById('player-play-btn').onclick = ()=>{
  if(nowPlaying?.type==='track') setPlayIcon(!isPlaying);
};

// ---------- Effet ripple universel (délégation, pas de handler par bouton) ----------
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button, .card, .artist-item');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  const prevPosition = getComputedStyle(btn).position;
  if(prevPosition === 'static') btn.style.position = 'relative';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', ()=> ripple.remove());
}, {passive:true});

// ---------- Révélation au scroll (IntersectionObserver) ----------
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      revealObserver.unobserve(entry.target);
    }
  });
}, {threshold:0.1, rootMargin:'0px 0px -40px 0px'});

function observeReveals(){
  document.querySelectorAll('#main section, #main .card, #main .artist-item').forEach((el, i)=>{
    if(el.classList.contains('in-view')) return;
    el.classList.add('reveal');
    el.style.transitionDelay = Math.min(i * 25, 300) + 'ms';
    revealObserver.observe(el);
  });
}

// ---------- Header dynamique au scroll ----------
const headerEl = document.querySelector('header');
window.addEventListener('scroll', ()=>{
  headerEl.classList.toggle('scrolled', window.scrollY > 8);
}, {passive:true});

// ---------- Init ----------
buildNav();
render();
observeReveals();

// ---------- PWA : installation et service worker ----------
let deferredInstallPrompt = null;
const installButtons = ['install-app-btn','install-app-btn-side']
  .map(id => document.getElementById(id)).filter(Boolean);
function showInstallHelp(){
  if(window.matchMedia('(display-mode: standalone)').matches){
    toast('NDULE+ est déjà installé.');
    return;
  }
  toast('Sur Android : menu ⋮ du navigateur, puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».');
}
installButtons.forEach(btn => btn.addEventListener('click', async () => {
  if(!deferredInstallPrompt){ showInstallHelp(); return; }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if(choice && choice.outcome === 'accepted') toast('Installation de NDULE+ lancée.');
}));
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  toast('NDULE+ est installé sur ton appareil.');
});
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.info('NDULE+ : service worker actif'))
      .catch(error => console.warn('Service worker non activé :', error));
  });
}
